[project]
name = "moneytor"
version = "0.1.0"
description = "Personal & family financial aggregation cockpit for Canadian brokerages."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Seyedramin Rasoulinezhad" }]
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Runtime deps are added per-phase (see IMPLEMENTATION_PLAN.md) to avoid front-loading.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pylint>=3.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneytor"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["moneytor"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, strict-leaning default set. Expand as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["moneytor"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["moneytor"]
warn_unused_configs = true

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint."messages control"]
# Defer opinionated docstring/format rules to ruff; keep pylint for deep checks.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]
