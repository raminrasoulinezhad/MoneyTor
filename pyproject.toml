[project]
name = "moneytor"
# Read from src/moneytor/__init__.py — see [tool.hatch.version] below.
dynamic = ["version"]
description = "Personal & family financial aggregation cockpit for Canadian brokerages."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Seyedramin Rasoulinezhad" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "plotly>=6.8.0",
    "pyside6>=6.11.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Runtime deps are added per-phase (see IMPLEMENTATION_PLAN.md) to avoid front-loading.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pylint>=3.0",
    "mypy>=1.11",
    "pytest-qt>=4.5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/moneytor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/moneytor"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["moneytor"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible, strict-leaning default set. Expand as the codebase grows.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["moneytor"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["moneytor"]
warn_unused_configs = true

# The pure core stays fully strict. GUI glue against the PySide6 C++ bindings
# needs relaxation: signals/slots and many Qt calls are typed as Any.
[[tool.mypy.overrides]]
module = "moneytor.ui.*"
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["PySide6.*", "plotly.*"]
ignore_missing_imports = true

# winreg is a Windows-only stdlib module; typeshed guards it behind
# sys.platform == "win32", so every attribute reads as undefined when we
# type-check the Windows autostart backend from Linux/macOS.
[[tool.mypy.overrides]]
module = "moneytor.autostart"
disable_error_code = ["attr-defined"]

[tool.pylint.main]
source-roots = ["src"]
extension-pkg-allow-list = ["PySide6"]

[tool.pylint.typecheck]
# PySide6 signals are dynamic; tell pylint their members exist.
generated-members = ["connect", "disconnect", "emit"]

[tool.pylint.design]
# UI windows and the design-token dataclass legitimately carry many fields.
max-attributes = 20
max-args = 8
max-positional-arguments = 8

[tool.pylint."messages control"]
# Defer opinionated docstring/format rules to ruff; keep pylint for deep checks.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    # Analogous adapters across layers (report model vs UI view-model) and
    # similar connector shapes legitimately resemble each other.
    "duplicate-code",
]
