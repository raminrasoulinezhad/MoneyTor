<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- rounded-square app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#ffffff" opacity="0.04"/>
  <!-- upward trend line -->
  <polyline points="52,176 100,128 140,150 204,80"
            fill="none" stroke="#ffffff" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head at the top-right node -->
  <polyline points="172,80 204,80 204,112"
            fill="none" stroke="#ffffff" stroke-width="14"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data nodes -->
  <circle cx="52" cy="176" r="11" fill="#ffffff"/>
  <circle cx="100" cy="128" r="11" fill="#ffffff"/>
  <circle cx="140" cy="150" r="11" fill="#ffffff"/>
</svg>
